<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" style="background-color: #0a0a0a;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Overgain — Aplicativo de acompanhamento de treinos e evolução" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Overgain" />
    <title>Overgain — Treino & Frequência</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0a0a0a !important;
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
        min-height: 100vh;
      }
      #root {
        min-height: 100vh;
        background-color: #0a0a0a;
      }
      .app-initial-splash {
        position: fixed;
        inset: 0;
        background-color: #0a0a0a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999999;
      }
      .app-initial-logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, #FF6B00 0%, #FF8533 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: 900;
        color: #ffffff;
        box-shadow: 0 0 32px rgba(255, 107, 0, 0.45);
        margin-bottom: 24px;
        letter-spacing: -1px;
      }
      .app-initial-brand {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 2px;
        color: #ffffff;
        margin-bottom: 28px;
      }
      .app-initial-spinner {
        width: 30px;
        height: 30px;
        border: 3px solid rgba(255, 107, 0, 0.15);
        border-top-color: #FF6B00;
        border-radius: 50%;
        animation: initial-spin 0.8s linear infinite;
      }
      @keyframes initial-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body style="background-color: #0a0a0a;">
    <div id="root">
      <div class="app-initial-splash">
        <div class="app-initial-logo">O</div>
        <div class="app-initial-brand">OVERGAIN</div>
        <div class="app-initial-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
